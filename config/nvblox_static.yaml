# Nvblox configuration for Static Reconstruction mode (no color)

nvblox_node:
  ros__parameters:
    # General settings
    global_frame: "map"
    voxel_size: 0.01
    use_tf_transforms: true

    # Static reconstruction mode - NO COLOR (geometry only)
    mapping_type: "static_tsdf"
    use_color: false
    use_depth: true
    use_lidar: false

    # Depth processing
    max_depth_update_hz: 30.0

    # ESDF for navigation
    compute_esdf: true
    esdf_2d: true
    esdf_update_rate_hz: 2.0
    esdf_slice_height: 0.5
    esdf_2d_min_height: 0.0
    esdf_2d_max_height: 1.0

    # Mesh visualization
    compute_mesh: true
    mesh_update_rate_hz: 10.0

    # Static mapper parameters
    static_mapper:
      projective_integrator_max_integration_distance_m: 1.2
      projective_integrator_truncation_distance_vox: 6.0
      weighting_mode: "inverse_square"
      projective_integrator_max_weight: 10.0
      mesh_integrator_min_weight: 0.01
      mesh_integrator_weld_vertices: true

    # Map clearing (optional - adjust based on robot movement)
    map_clearing_radius_m: -1.0 # Disabled by default

    # QoS settings
    depth_qos: "SYSTEM_DEFAULT"
